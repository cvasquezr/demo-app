version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-appdb}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

  # Versión 2 — Descomentar cuando necesites procesamiento asíncrono con Celery
  # redis:
  #   image: redis:7-alpine
  #   networks:
  #     - app_network
  #
  # celery_worker:
  #   build: ./backend
  #   command: celery -A app.core.celery_app worker --loglevel=info
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-appdb}
  #     SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please}
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on:
  #     - redis
  #     - postgres
  #   networks:
  #     - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
